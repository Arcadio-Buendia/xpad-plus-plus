name: Linux build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: node --check main.js
      - run: node --test tests/system-fonts.test.mjs
      - run: python3 tests/xpad-migration-test.py
      - run: npm run build -- --linux --dir --config.electronDist=node_modules/electron/dist
      - uses: actions/upload-artifact@v4
        with:
          name: xpad-plus-plus-linux
          path: dist/linux-unpacked/
