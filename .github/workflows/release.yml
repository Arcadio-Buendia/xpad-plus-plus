name: Linux build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check main.js
      - run: python3 -m unittest discover -s tests
      - run: npm run build:desktop
      # tar preserves executable permissions when downloading the artifact.
      - run: tar -C dist -czf dist/xpad-plus-plus-linux-x64.tar.gz linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: xpad-plus-plus-linux-x64
          path: dist/xpad-plus-plus-linux-x64.tar.gz
